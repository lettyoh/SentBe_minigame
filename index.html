<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>센트비 미니게임</title>
  <style>
    :root{
      --bg:#f7f8fb;
      --panel:#ffffff;
      --card:#ffffff;
      --text:#20242c;
      --muted:#7b8492;
      --border:#e6e9ef;
      --accent:#5b7cff;
      --accent-soft:#edf1ff;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button{
      font:inherit;
    }

    .app{
      width:min(100%,720px);
      margin:0 auto;
      padding:24px 16px 40px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    h1{
      margin:0;
      font-size:22px;
      line-height:1.35;
    }

    .subtitle{
      margin-top:6px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .restart{
      border:1px solid var(--border);
      background:var(--accent-soft);
      color:var(--text);
      border-radius:12px;
      padding:10px 14px;
      font-weight:700;
      cursor:pointer;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-bottom:14px;
    }

    .stat{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
      min-width:0;
      position:relative;
      overflow:hidden;
    }

    .stat-label{
      color:var(--muted);
      font-size:12px;
      margin-bottom:4px;
    }

    .stat-value{
      font-size:26px;
      font-weight:800;
      line-height:1.1;
      white-space:nowrap;
    }

    .time-row{
      display:flex;
      align-items:baseline;
      gap:4px;
    }

    .time-unit{
      color:var(--muted);
      font-size:14px;
    }

    .bonus{
      position:absolute;
      right:10px;
      bottom:6px;
      font-size:14px;
      font-weight:800;
      color:#ff5b75;
      opacity:0;
    }

    .bonus-pop{
      animation:bonusPop .55s ease-out;
    }

    .board-wrap{
      position:relative;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:24px;
      padding:10px;
      overflow:hidden;
    }

    .board{
      position:relative;
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:8px;
    }

    .tile{
      position:relative;
      aspect-ratio:1/1;
      border-radius:16px;
      border:1px solid var(--border);
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
      cursor:grab;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
      min-width:0;
      z-index:1;
      will-change:transform;
      transition:filter .12s ease, outline-color .12s ease;
    }

    .tile:active{cursor:grabbing}

    .tile.dragging{
      z-index:8;
      filter:brightness(1.03);
    }

    .tile.selected{
      outline:3px solid var(--accent);
      outline-offset:-3px;
    }

    .tile.special{
      cursor:pointer;
      background:#fffdf7;
    }

    .jelly{
      width:74%;
      height:74%;
      border-radius:47% 47% 42% 42%;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:
        inset 0 -6px 0 rgba(0,0,0,.07),
        inset 5px 6px 0 rgba(255,255,255,.42),
        0 2px 5px rgba(0,0,0,.07);
    }

    .jelly::before,
    .jelly::after{
      content:"";
      position:absolute;
      top:39%;
      width:7%;
      height:10%;
      background:#2f3440;
      border-radius:50%;
    }

    .jelly::before{left:31%}
    .jelly::after{right:31%}

    .mouth{
      position:absolute;
      left:50%;
      top:58%;
      width:21%;
      height:10%;
      transform:translateX(-50%);
      border-bottom:2px solid rgba(47,52,64,.8);
      border-radius:0 0 20px 20px;
    }

    .shine{
      position:absolute;
      left:18%;
      top:17%;
      width:22%;
      height:13%;
      border-radius:50%;
      background:rgba(255,255,255,.78);
      transform:rotate(-24deg);
    }

    .j1{background:#ff6685}
    .j2{background:#4eb8ff}
    .j3{background:#ffd54a}
    .j4{background:#5bdc82}
    .j5{background:#a879ff}
    .j6{background:#ff9a4a}


    /* Different expressions by jelly color */
    .jelly.f1::before,.jelly.f1::after{top:39%}
    .mouth.m1{border-bottom:2px solid rgba(47,52,64,.85);border-radius:0 0 20px 20px}

    .jelly.f2::before{
      top:41%;
      width:9%;
      height:3px;
      border-radius:999px;
    }
    .jelly.f2::after{top:39%}
    .mouth.m2{
      width:18%;
      top:58%;
      border-bottom:2px solid rgba(47,52,64,.8);
      border-radius:0 0 18px 18px;
      transform:translateX(-50%) rotate(-8deg);
    }

    .jelly.f3::before,.jelly.f3::after{top:38%}
    .mouth.m3{
      width:13%;
      height:13%;
      top:57%;
      border:2px solid rgba(47,52,64,.78);
      border-radius:50%;
      transform:translateX(-50%);
      background:transparent;
    }

    .jelly.f4::before,.jelly.f4::after{
      top:41%;
      width:9%;
      height:3px;
      border-radius:999px;
    }
    .mouth.m4{
      width:16%;
      top:59%;
      border-bottom:2px solid rgba(47,52,64,.75);
      border-radius:0 0 14px 14px;
      transform:translateX(-50%);
    }

    .jelly.f5::before{top:39%}
    .jelly.f5::after{
      top:41%;
      width:9%;
      height:3px;
      border-radius:999px;
    }
    .mouth.m5{
      width:20%;
      top:58%;
      border-bottom:2px solid rgba(47,52,64,.8);
      border-radius:0 0 18px 18px;
      transform:translateX(-50%) rotate(10deg);
    }

    .jelly.f6::before,.jelly.f6::after{top:38%}
    .mouth.m6{
      width:18%;
      height:11%;
      top:57%;
      border:2px solid rgba(47,52,64,.8);
      border-top:0;
      border-radius:0 0 18px 18px;
      transform:translateX(-50%);
      background:rgba(255,255,255,.25);
    }

    .special-candy{
      width:80%;
      height:80%;
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:2px;
      background:rgba(255,255,255,.9);
      box-shadow:
        inset 0 -5px 0 rgba(0,0,0,.05),
        0 2px 6px rgba(0,0,0,.08);
      font-size:clamp(21px,5vw,34px);
      font-weight:800;
    }

    .arrow{
      font-size:.58em;
      color:#596170;
      margin-left:-4px;
    }

    .legend{
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
      margin-top:12px;
      color:var(--muted);
      font-size:12px;
    }

    .message{
      min-height:30px;
      text-align:center;
      margin-top:12px;
      color:var(--muted);
      font-size:14px;
      font-weight:700;
    }

    .tile.matching .jelly{
      animation:matchPop .44s cubic-bezier(.16,.8,.25,1) forwards;
    }

    .tile.matching::before,
    .tile.matching::after{
      content:"✦";
      position:absolute;
      left:50%;
      top:50%;
      z-index:9;
      font-size:17px;
      pointer-events:none;
      color:#ffd54a;
      animation:sparkA .44s ease-out forwards;
    }

    .tile.matching::after{
      content:"✧";
      color:#4eb8ff;
      animation-name:sparkB;
    }

    .tile.burst .jelly,
    .tile.burst .special-candy{
      animation:burst .32s ease-out forwards;
    }

    .line-fx{
      position:absolute;
      pointer-events:none;
      z-index:20;
      border-radius:999px;
      background:rgba(255,213,74,.76);
      opacity:0;
    }

    .line-fx.h{
      height:14px;
      left:0;
      right:0;
      transform:translateY(-50%);
      animation:beamH .38s ease-out forwards;
    }

    .line-fx.v{
      width:14px;
      top:0;
      bottom:0;
      transform:translateX(-50%);
      animation:beamV .38s ease-out forwards;
    }

    @keyframes matchPop{
      0%{transform:scale(1)}
      25%{transform:scale(1.2,.83)}
      48%{transform:scale(.9,1.18)}
      72%{transform:scale(1.12)}
      100%{transform:scale(0);opacity:0}
    }

    @keyframes burst{
      0%{transform:scale(1)}
      45%{transform:scale(1.24)}
      100%{transform:scale(0);opacity:0}
    }

    @keyframes sparkA{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
      35%{opacity:1}
      100%{opacity:0;transform:translate(-160%,-175%) scale(1.6) rotate(90deg)}
    }

    @keyframes sparkB{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
      30%{opacity:1}
      100%{opacity:0;transform:translate(85%,-170%) scale(1.5) rotate(-90deg)}
    }

    @keyframes beamH{
      0%{opacity:0;transform:translateY(-50%) scaleX(.05)}
      30%{opacity:1}
      100%{opacity:0;transform:translateY(-50%) scaleX(1)}
    }

    @keyframes beamV{
      0%{opacity:0;transform:translateX(-50%) scaleY(.05)}
      30%{opacity:1}
      100%{opacity:0;transform:translateX(-50%) scaleY(1)}
    }

    @keyframes bonusPop{
      0%{opacity:0;transform:translateY(8px) scale(.9)}
      28%{opacity:1;transform:translateY(0) scale(1.12)}
      100%{opacity:0;transform:translateY(-15px) scale(1)}
    }


    /* Broken-jelly effect */
    .tile.breaking .jelly{
      animation:jellyBreak .46s cubic-bezier(.18,.7,.28,1) forwards !important;
    }

    .tile.breaking::before,
    .tile.breaking::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:9px;
      height:9px;
      border-radius:3px;
      background:currentColor;
      box-shadow:
        16px -13px 0 #ffd54a,
        -17px -10px 0 #4eb8ff,
        15px 15px 0 #ff6685,
        -14px 16px 0 #5bdc82,
        0 -20px 0 #a879ff;
      z-index:15;
      opacity:0;
      pointer-events:none;
      animation:jellyShards .46s ease-out forwards;
    }

    .tile.breaking::after{
      width:5px;
      height:5px;
      border-radius:50%;
      background:#fff;
      box-shadow:
        22px 1px 0 rgba(255,255,255,.95),
        -21px 3px 0 rgba(255,255,255,.9),
        10px -19px 0 rgba(255,255,255,.9),
        -9px 20px 0 rgba(255,255,255,.95);
      animation:jellySpark .42s ease-out forwards;
    }

    /* Candy creation */
    .tile.candy-born .special-candy{
      animation:candyBorn .58s cubic-bezier(.18,.9,.25,1.2) forwards;
    }

    .tile.candy-born::before,
    .tile.candy-born::after{
      content:"✦";
      position:absolute;
      left:50%;
      top:50%;
      z-index:18;
      font-size:18px;
      color:#ffd54a;
      opacity:0;
      pointer-events:none;
      animation:candySparkA .58s ease-out forwards;
    }

    .tile.candy-born::after{
      content:"✧";
      color:#ff6685;
      animation-name:candySparkB;
    }


    /* Game start modal */
    .start-modal{
      position:fixed;
      inset:0;
      z-index:998;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
    }

    .start-modal.show{
      opacity:1;
      pointer-events:auto;
    }

    .start-modal-backdrop{
      position:absolute;
      inset:0;
      background:rgba(26,30,40,.42);
      backdrop-filter:blur(5px);
    }

    .start-modal-card{
      position:relative;
      width:min(100%,360px);
      background:#fff;
      border-radius:26px;
      padding:30px 22px 22px;
      text-align:center;
      box-shadow:0 22px 60px rgba(15,23,42,.22);
      animation:startCardPop .42s cubic-bezier(.16,.88,.28,1.12);
    }

    .start-icon{
      width:68px;
      height:68px;
      margin:0 auto 10px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff6dd;
      font-size:38px;
      box-shadow:inset 0 -5px 0 rgba(0,0,0,.04);
    }

    .start-modal-card h2{
      margin:0;
      font-size:28px;
    }

    .start-modal-card p{
      margin:10px 0 22px;
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
    }

    .start-game-btn{
      width:100%;
      min-height:50px;
      border:0;
      border-radius:15px;
      background:var(--accent);
      color:#fff;
      font-size:17px;
      font-weight:900;
      cursor:pointer;
    }

    .start-game-btn:active{
      transform:scale(.985);
    }

    @keyframes startCardPop{
      0%{opacity:0;transform:translateY(16px) scale(.94)}
      65%{opacity:1;transform:translateY(-3px) scale(1.03)}
      100%{opacity:1;transform:translateY(0) scale(1)}
    }

    /* Time over modal */
    .game-modal{
      position:fixed;
      inset:0;
      z-index:999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease;
    }

    .game-modal.show{
      opacity:1;
      pointer-events:auto;
    }

    .game-modal-backdrop{
      position:absolute;
      inset:0;
      background:rgba(26,30,40,.5);
      backdrop-filter:blur(5px);
    }

    .game-modal-card{
      position:relative;
      width:min(100%,360px);
      background:#fff;
      border-radius:26px;
      padding:28px 22px 22px;
      text-align:center;
      box-shadow:0 22px 60px rgba(15,23,42,.23);
      transform:translateY(18px) scale(.92);
      opacity:0;
    }

    .game-modal.show .game-modal-card{
      animation:modalPop .42s cubic-bezier(.16,.88,.28,1.12) forwards;
    }


    .ended-board-overlay{
      position:absolute;
      inset:10px;
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(24,28,36,.45);
      backdrop-filter:blur(4px);
      z-index:40;
    }

    .ended-board-overlay[hidden]{
      display:none !important;
    }

    .ended-board-card{
      width:min(100%,280px);
      text-align:center;
      background:rgba(255,255,255,.96);
      border-radius:22px;
      padding:22px 18px 18px;
      box-shadow:0 16px 40px rgba(15,23,42,.16);
    }

    .ended-board-title{
      font-size:20px;
      font-weight:900;
      margin-bottom:8px;
    }

    .ended-board-score-label{
      color:var(--muted);
      font-size:12px;
      margin-bottom:4px;
    }

    .ended-board-score{
      font-size:34px;
      font-weight:900;
      line-height:1;
      margin-bottom:16px;
    }

    .play-again-btn{
      width:100%;
      min-height:46px;
      border:0;
      border-radius:14px;
      background:var(--accent);
      color:#fff;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    .countdown-overlay{
      position:fixed;
      inset:0;
      z-index:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(2px);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
    }

    .countdown-overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .countdown-number{
      font-size:84px;
      font-weight:900;
      line-height:1;
      color:#fff;
      text-shadow:0 10px 30px rgba(0,0,0,.25);
      opacity:0;
      transform:scale(.6);
    }

    .countdown-number.animate{
      animation:countdownPop .78s cubic-bezier(.16,.88,.28,1.08) forwards;
    }

    .modal-close-btn{
      position:absolute;
      top:14px;
      right:14px;
      width:34px;
      height:34px;
      border:0;
      border-radius:999px;
      background:#f2f4f8;
      color:#4b5563;
      font-size:22px;
      line-height:1;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .modal-close-btn:active,
    .play-again-btn:active{
      transform:scale(.985);
    }

    @keyframes countdownPop{
      0%{opacity:0;transform:scale(.5)}
      18%{opacity:1;transform:scale(1.18)}
      72%{opacity:1;transform:scale(1)}
      100%{opacity:0;transform:scale(.88)}
    }

    .time-over-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:34px;
      padding:0 14px;
      border-radius:999px;
      background:#ff6685;
      color:#fff;
      font-size:14px;
      font-weight:900;
      letter-spacing:.08em;
      margin-bottom:12px;
    }

    .game-modal-card h2{
      margin:0 0 18px;
      font-size:27px;
    }

    .modal-score-label{
      margin:0;
      color:var(--muted);
      font-size:13px;
    }

    .modal-score{
      margin:4px 0 22px;
      font-size:42px;
      font-weight:900;
      line-height:1;
    }

    .modal-restart{
      width:100%;
      min-height:48px;
      border:0;
      border-radius:15px;
      background:var(--accent);
      color:#fff;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    .modal-actions{
      display:grid;
      gap:10px;
    }

    .modal-share{
      width:100%;
      min-height:48px;
      border:1px solid #dfe4ee;
      border-radius:15px;
      background:#f7f8fb;
      color:#2f3440;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    .modal-share:active,
    .modal-restart:active{
      transform:scale(.985);
    }

    .share-feedback{
      min-height:20px;
      margin-top:10px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    /* Stronger 4-match -> candy transformation */
    .candy-vortex{
      position:absolute;
      z-index:24;
      width:58px;
      height:58px;
      border-radius:50%;
      pointer-events:none;
      transform:translate(-50%,-50%) scale(.35);
      opacity:0;
      animation:vortexCore .64s cubic-bezier(.18,.8,.25,1) forwards;
    }

    .candy-vortex::before,
    .candy-vortex::after{
      content:"";
      position:absolute;
      inset:5px;
      border-radius:50%;
      border:5px solid transparent;
      border-top-color:#ff6685;
      border-right-color:#ffd54a;
      border-bottom-color:#4eb8ff;
      animation:vortexSpin .5s linear forwards;
    }

    .candy-vortex::after{
      inset:14px;
      border-width:4px;
      border-top-color:#a879ff;
      border-right-color:#5bdc82;
      border-bottom-color:#ff9a4a;
      animation-direction:reverse;
      animation-duration:.42s;
    }

    .candy-vortex .vortex-star{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(.2);
      font-size:24px;
      animation:vortexStar .62s ease-out forwards;
    }

    .tile.candy-born .special-candy{
      animation:candyBornStrong .68s cubic-bezier(.16,.92,.24,1.18) forwards !important;
    }

    @keyframes vortexCore{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
      15%{opacity:1}
      68%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
    }

    @keyframes vortexSpin{
      0%{transform:rotate(0deg) scale(.65);opacity:.5}
      70%{opacity:1}
      100%{transform:rotate(520deg) scale(1.1);opacity:0}
    }

    @keyframes vortexStar{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0deg)}
      42%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(100deg)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(220deg)}
    }

    @keyframes candyBornStrong{
      0%{transform:scale(0) rotate(-28deg);opacity:0;filter:brightness(1.5)}
      38%{transform:scale(1.45) rotate(10deg);opacity:1}
      58%{transform:scale(.86) rotate(-4deg)}
      76%{transform:scale(1.14) rotate(2deg)}
      100%{transform:scale(1);opacity:1;filter:brightness(1)}
    }

    @keyframes jellyBreak{
      0%{transform:scale(1);filter:brightness(1)}
      20%{transform:scale(1.18,.84);filter:brightness(1.12)}
      42%{transform:scale(.92,1.14)}
      68%{transform:scale(.7) rotate(-7deg);opacity:.9}
      100%{transform:scale(.08) rotate(15deg);opacity:0}
    }

    @keyframes jellyShards{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
      22%{opacity:1}
      100%{opacity:0;transform:translate(-50%,-50%) scale(2.15) rotate(30deg)}
    }

    @keyframes jellySpark{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
      30%{opacity:1}
      100%{opacity:0;transform:translate(-50%,-50%) scale(2.8)}
    }

    @keyframes candyBorn{
      0%{transform:scale(0) rotate(-25deg);opacity:0}
      45%{transform:scale(1.32) rotate(8deg);opacity:1}
      68%{transform:scale(.9) rotate(-3deg)}
      84%{transform:scale(1.08)}
      100%{transform:scale(1);opacity:1}
    }

    @keyframes candySparkA{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
      30%{opacity:1}
      100%{opacity:0;transform:translate(-165%,-145%) scale(1.7) rotate(100deg)}

    @keyframes candySparkB{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}

      100%{opacity:1;transform:translateY(0) scale(1)}

      };

      const PIECES = {
        1:{ label:"동전" },
        2:{ label:"지폐" },
        3:{ label:"비행기" },
        4:{ label:"지구본" },
        5:{ label:"센트비", logo:true }
      };

      document.querySelectorAll("[data-sentbe-logo]").forEach(img => {
        img.src = LOGO_DATA;
      });

      function jellyHtml(v){
        const item = PIECES[v];
        if(item?.logo){
          return `<div class="jelly j${v}"><span class="piece-logo-card"><img class="piece-logo" src="${LOGO_DATA}" alt="" draggable="false"></span></div>`;
        }
        return `<div class="jelly j${v}"><img class="piece-image" src="${PIECE_IMAGES[v]}" alt="" draggable="false"></div>`;
      }

      function specialHtml(dir){
        return `
          <div class="special-candy">
            <span>🎁</span>
            <span class="arrow">${dir === "row" ? "↔" : "↕"}</span>
          </div>
        `;
      }

      function render(){
        boardEl.innerHTML = "";

        for(let r=0; r<SIZE; r++){
          for(let c=0; c<SIZE; c++){
            const piece = board[r][c];
            const btn = document.createElement("button");

            btn.type = "button";
            btn.className = "tile";
            btn.dataset.r = r;
            btn.dataset.c = c;
            btn.disabled = !gameStarted || ended || locked;

            if(piece?.type === "special"){
              btn.classList.add("special");
              btn.innerHTML = specialHtml(piece.dir);
              btn.setAttribute(
                "aria-label",
                piece.dir === "row"
                  ? "가로 한 줄 삭제 선물 상자"
                  : "세로 한 줄 삭제 선물 상자"
              );
            }else{
              btn.innerHTML = jellyHtml(piece.v);
              btn.setAttribute("aria-label", PIECES[piece.v]?.label || `아이콘 ${piece.v}`);
            }

            if(selected && selected.r === r && selected.c === c){
              btn.classList.add("selected");
            }

            btn.addEventListener("click", onClick);
            btn.addEventListener("pointerdown", onPointerDown);
            btn.addEventListener("pointermove", onPointerMove);
            btn.addEventListener("pointerup", onPointerUp);
            btn.addEventListener("pointercancel", onPointerCancel);

            boardEl.appendChild(btn);
          }
        }

        scoreEl.textContent = score.toLocaleString();
        timerEl.textContent = timeLeft;
      }

      function tileAt(p){
        return boardEl.querySelector(
          `.tile[data-r="${p.r}"][data-c="${p.c}"]`
        );
      }

      function swapData(a,b){
        const t = board[a.r][a.c];
        board[a.r][a.c] = board[b.r][b.c];
        board[b.r][b.c] = t;
      }

      async function animateSwap(a,b,back=false){
        const elA = tileAt(a);
        const elB = tileAt(b);

        if(
          !elA ||
          !elB ||
          !elA.animate ||
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ){
          return;
        }

        const ra = elA.getBoundingClientRect();
        const rb = elB.getBoundingClientRect();

        const dx = rb.left - ra.left;
        const dy = rb.top - ra.top;

        const framesA = back
          ? [
              {transform:"translate(0,0)"},
              {transform:`translate(${dx}px,${dy}px)`},
              {transform:"translate(0,0)"}
            ]
          : [
              {transform:"translate(0,0)"},
              {transform:`translate(${dx}px,${dy}px)`}
            ];

        const framesB = back
          ? [
              {transform:"translate(0,0)"},
              {transform:`translate(${-dx}px,${-dy}px)`},
              {transform:"translate(0,0)"}
            ]
          : [
              {transform:"translate(0,0)"},
              {transform:`translate(${-dx}px,${-dy}px)`}
            ];

        const duration = back ? 320 : 210;

        await Promise.all([
          elA.animate(framesA,{
            duration,
            easing:"cubic-bezier(.2,.75,.25,1)"
          }).finished.catch(() => {}),
          elB.animate(framesB,{
            duration,
            easing:"cubic-bezier(.2,.75,.25,1)"
          }).finished.catch(() => {})
        ]);
      }

      async function onClick(e){
        if(Date.now() < suppressClickUntil || locked || ended) return;

        const p = pos(e.currentTarget);
        const piece = board[p.r][p.c];

        if(piece?.type === "special"){
          selected = null;
          await activateSpecial(p);
          return;
        }

        if(!selected){
          selected = p;
          render();
          return;
        }

        if(selected.r === p.r && selected.c === p.c){
          selected = null;
          render();
          return;
        }

        if(!adjacent(selected,p)){
          selected = p;
          render();
          return;
        }

        const first = selected;
        selected = null;
        await trySwap(first,p);
      }

      function onPointerDown(e){
        if(!gameStarted || locked || ended) return;
        if(e.pointerType === "mouse" && e.button !== 0) return;
        e.preventDefault();

        const start = pos(e.currentTarget);
        const piece = board[start.r][start.c];

        if(piece?.type === "special") return;

        drag = {
          start,
          x:e.clientX,
          y:e.clientY,
          id:e.pointerId,
          moved:false,
          target:null,
          el:e.currentTarget
        };

        e.currentTarget.setPointerCapture?.(e.pointerId);
        e.currentTarget.classList.add("dragging");
      }

      function onPointerMove(e){
        if(!drag || drag.id !== e.pointerId || locked || ended) return;
        e.preventDefault();

        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;

        if(Math.max(Math.abs(dx),Math.abs(dy)) < 8) return;

        drag.moved = true;

        let target;

        if(Math.abs(dx) > Math.abs(dy)){
          target = {
            r:drag.start.r,
            c:drag.start.c + (dx > 0 ? 1 : -1)
          };
        }else{
          target = {
            r:drag.start.r + (dy > 0 ? 1 : -1),
            c:drag.start.c
          };
        }

        if(
          target.r >= 0 &&
          target.r < SIZE &&
          target.c >= 0 &&
          target.c < SIZE
        ){
          drag.target = target;
        }

        const max = 34;
        const tx = Math.max(-max,Math.min(max,dx * 0.5));
        const ty = Math.max(-max,Math.min(max,dy * 0.5));

        drag.el.style.transform =
          `translate(${tx}px,${ty}px) scale(1.05)`;
      }

      async function onPointerUp(e){
        if(!drag || drag.id !== e.pointerId) return;
        e.preventDefault();

        const d = drag;
        drag = null;

        d.el.classList.remove("dragging");
        d.el.style.transform = "";
        try{
          if(d.el.hasPointerCapture?.(e.pointerId)){
            d.el.releasePointerCapture?.(e.pointerId);
          }
        }catch(_){}

        if(d.moved){
          suppressClickUntil = Date.now() + 350;

          if(d.target && !locked && !ended){
            selected = null;
            await trySwap(d.start,d.target);
          }
        }
      }

      function onPointerCancel(){
        if(drag?.el){
          drag.el.classList.remove("dragging");
          drag.el.style.transform = "";
        }
        drag = null;
      }

      async function trySwap(a,b){
        if(!adjacent(a,b) || locked || ended) return;

        locked = true;

        await animateSwap(a,b,false);
        swapData(a,b);
        render();

        if(!findMatches().cells.size){
          swapData(a,b);
          render();

          await animateSwap(a,b,true);

          messageEl.textContent = "3개 이상 연결되지 않았어요.";

          locked = false;
          render();
          await ensurePlayableBoard();
          return;
        }

        locked = false;
        await resolveMatches();
      }

      function findMatches(){
        const set = new Set();
        const specials = [];
        const straightGroups = [];

        // Horizontal runs: 3+ disappear, 4+ create a candy.
        for(let r=0; r<SIZE; r++){
          let start = 0;

          for(let c=1; c<=SIZE; c++){
            const current = c < SIZE ? board[r][c] : null;
            const base = board[r][start];

            if(c < SIZE && same(current,base)) continue;

            const len = c - start;

            if(base?.type === "normal" && len >= 3){
              const cells = [];
              for(let x=start; x<c; x++){
                set.add(key(r,x));
                cells.push({r,c:x});
              }

              if(len >= 4){
                straightGroups.push({
                  cells,
                  dir:"row",
                  value:base.v
                });
              }
            }

            start = c;
          }
        }

        // Vertical runs: 3+ disappear, 4+ create a candy.
        for(let c=0; c<SIZE; c++){
          let start = 0;

          for(let r=1; r<=SIZE; r++){
            const current = r < SIZE ? board[r][c] : null;
            const base = start < SIZE ? board[start][c] : null;

            if(r < SIZE && same(current,base)) continue;

            const len = r - start;

            if(base?.type === "normal" && len >= 3){
              const cells = [];
              for(let x=start; x<r; x++){
                set.add(key(x,c));
                cells.push({r:x,c});
              }

              if(len >= 4){
                straightGroups.push({
                  cells,
                  dir:"col",
                  value:base.v
                });
              }
            }

            start = r;
          }
        }

        // 2x2 square match: all 4 disappear.
        for(let r=0; r<SIZE-1; r++){
          for(let c=0; c<SIZE-1; c++){
            const a=board[r][c];
            const b=board[r][c+1];
            const d=board[r+1][c];
            const e=board[r+1][c+1];

            if(
              a?.type==="normal" &&
              same(a,b) &&
              same(a,d) &&
              same(a,e)
            ){
              set.add(key(r,c));
              set.add(key(r,c+1));
              set.add(key(r+1,c));
              set.add(key(r+1,c+1));
            }
          }
        }

        // Straight 4+ candy groups.
        for(const group of straightGroups){
          specials.push({
            cells:group.cells,
            dir:group.dir,
            preferred:null,
            kind:"straight"
          });
        }

        // Detect connected matched components of the same jelly.
        // If 5+ cells form a non-straight shape (T / L / ㄱ / similar),
        // create one candy at a junction/corner when possible.
        const visited = new Set();

        for(const id of set){
          if(visited.has(id)) continue;

          const [sr,sc] = id.split(",").map(Number);
          const source = board[sr][sc];

          if(!source || source.type !== "normal") continue;

          const queue = [{r:sr,c:sc}];
          const component = [];
          visited.add(id);

          while(queue.length){
            const cur = queue.shift();
            component.push(cur);

            const neighbors = [
              {r:cur.r-1,c:cur.c},
              {r:cur.r+1,c:cur.c},
              {r:cur.r,c:cur.c-1},
              {r:cur.r,c:cur.c+1}
            ];

            for(const n of neighbors){
              if(n.r<0 || n.r>=SIZE || n.c<0 || n.c>=SIZE) continue;

              const nid = key(n.r,n.c);
              if(visited.has(nid) || !set.has(nid)) continue;

              const piece = board[n.r][n.c];
              if(piece?.type==="normal" && piece.v===source.v){
                visited.add(nid);
                queue.push(n);
              }
            }
          }

          if(component.length < 5) continue;

          const rows = new Set(component.map(p=>p.r));
          const cols = new Set(component.map(p=>p.c));
          const nonStraight = rows.size > 1 && cols.size > 1;

          if(!nonStraight) continue;

          // Prefer a junction (3+ matched neighbors), otherwise an L-corner (2 perpendicular neighbors).
          let preferred = null;

          const neighborCount = p => {
            const dirs = [
              {dr:-1,dc:0,name:"u"},
              {dr:1,dc:0,name:"d"},
              {dr:0,dc:-1,name:"l"},
              {dr:0,dc:1,name:"r"}
            ];
            const present = dirs.filter(d =>
              component.some(q => q.r===p.r+d.dr && q.c===p.c+d.dc)
            );
            return present;
          };

          for(const p of component){
            const present = neighborCount(p);
            if(present.length >= 3){
              preferred = p;
              break;
            }
          }

          if(!preferred){
            for(const p of component){
              const present = neighborCount(p).map(x=>x.name);
              const hasVertical = present.includes("u") || present.includes("d");
              const hasHorizontal = present.includes("l") || present.includes("r");
              if(hasVertical && hasHorizontal){
                preferred = p;
                break;
              }
            }
          }

          preferred = preferred || component[Math.floor(component.length/2)];

          // Use the dominant axis only to choose what kind of line-clearing candy is created.
          let horizontalEdges = 0;
          let verticalEdges = 0;
          for(const p of component){
            if(component.some(q=>q.r===p.r && q.c===p.c+1)) horizontalEdges++;
            if(component.some(q=>q.r===p.r+1 && q.c===p.c)) verticalEdges++;
          }

          specials.push({
            cells:component,
            dir:horizontalEdges >= verticalEdges ? "row" : "col",
            preferred,
            kind:"shape"
          });
        }

        return { cells:set, specials };
      }

      function hasPossibleMove(){
        // A special candy can always be used by tapping it.
        for(let r=0; r<SIZE; r++){
          for(let c=0; c<SIZE; c++){
            if(board[r][c]?.type === "special"){
              return true;
            }
          }
        }

        // Test each adjacent swap without changing the visible board.
        for(let r=0; r<SIZE; r++){
          for(let c=0; c<SIZE; c++){
            const here = {r,c};

            const candidates = [];
            if(c + 1 < SIZE) candidates.push({r,c:c+1});
            if(r + 1 < SIZE) candidates.push({r:r+1,c});

            for(const other of candidates){
              swapData(here,other);
              const createsMatch = findMatches().cells.size > 0;
              swapData(here,other);

              if(createsMatch){
                return true;
              }
            }
          }
        }

        return false;
      }

      function hasImmediateMatch(){
        return findMatches().cells.size > 0;
      }

      function shuffleBoardUntilPlayable(){
        const pieces = board.flat().filter(Boolean);

        // Fisher-Yates shuffle, retrying until the board has
        // no automatic matches and at least one valid player action.
        for(let attempt=0; attempt<200; attempt++){
          for(let i=pieces.length-1; i>0; i--){
            const j = Math.floor(Math.random() * (i+1));
            [pieces[i],pieces[j]] = [pieces[j],pieces[i]];
          }

          let idx = 0;
          for(let r=0; r<SIZE; r++){
            for(let c=0; c<SIZE; c++){
              board[r][c] = pieces[idx++];
            }
          }

          if(!hasImmediateMatch() && hasPossibleMove()){
            return true;
          }
        }

        // Fallback: rebuild a fresh board until it is playable.
        for(let attempt=0; attempt<200; attempt++){
          makeBoard();
          if(!hasImmediateMatch() && hasPossibleMove()){
            return true;
          }
        }

        return false;
      }

      async function ensurePlayableBoard(showMessage=true){
        if(ended || hasPossibleMove()) return false;

        locked = true;

        if(showMessage){
          messageEl.textContent = "움직일 수 있는 조합이 없어 아이콘을 다시 섞었어요! 🔀";
        }

        await sleep(220);
        shuffleBoardUntilPlayable();
        selected = null;
        render();
        await sleep(180);

        locked = false;
        render();
        return true;
      }

      function animateCells(cells,cls="matching"){
        boardEl.querySelectorAll(".tile").forEach(el => {
          const id = key(+el.dataset.r,+el.dataset.c);
          if(cells.has(id)){
            el.classList.add(cls);
          }
        });
      }


      async function animateCandyBirth(finalPositions){
        if(!finalPositions || !finalPositions.length) return;

        const effects = [];

        // IMPORTANT:
        // finalPositions are calculated AFTER collapse/refill, so the vortex
        // always appears on the cell where the candy actually ended up.
        for(const p of finalPositions){
          const el = tileAt(p);
          if(!el) continue;

          const boardRect = boardEl.getBoundingClientRect();
          const rect = el.getBoundingClientRect();
          const cx = rect.left - boardRect.left + rect.width/2;
          const cy = rect.top - boardRect.top + rect.height/2;

          const vortex = document.createElement("div");
          vortex.className = "candy-vortex";
          vortex.style.left = `${cx}px`;
          vortex.style.top = `${cy}px`;
          vortex.innerHTML = '<span class="vortex-star">✨</span>';
          boardEl.appendChild(vortex);
          effects.push(vortex);
        }

        await sleep(420);

        for(const p of finalPositions){
          const el = tileAt(p);
          if(el && board[p.r][p.c]?.type === "special"){
            el.classList.add("candy-born");
          }
        }

        await sleep(260);
        effects.forEach(el => el.remove());
      }



      function showEndedBoardScreen(){
        endedBoardScore.textContent = score.toLocaleString();
        endedBoardOverlay.hidden = false;
      }

      function hideEndedBoardScreen(){
        endedBoardOverlay.hidden = true;
      }

      async function runCountdown(){
        const sequence = ["3","2","1"];
        countdownOverlay.classList.add("show");
        countdownOverlay.setAttribute("aria-hidden","false");

        for(const num of sequence){
          countdownNumber.textContent = num;
          countdownNumber.classList.remove("animate");
          void countdownNumber.offsetWidth;
          countdownNumber.classList.add("animate");
          await sleep(820);
        }

        countdownOverlay.classList.remove("show");
        countdownOverlay.setAttribute("aria-hidden","true");
      }

      async function prepareNewBoard(startImmediately){
        clearInterval(timerId);

        score = 0;
        timeLeft = 30;
        selected = null;
        locked = false;
        ended = false;
        drag = null;
        messageEl.textContent = "";
        hideTimeOver();
        hideEndedBoardScreen();

        makeBoard();

        if(!hasPossibleMove()){
          shuffleBoardUntilPlayable();
        }

        gameStarted = !!startImmediately;
        hideStartScreen();
        render();

        if(startImmediately){
          startTimer();
        }
      }

      function showStartScreen(){
        startModal.classList.add("show");
        startModal.setAttribute("aria-hidden","false");
      }

      function hideStartScreen(){
        startModal.classList.remove("show");
        startModal.setAttribute("aria-hidden","true");
      }

      async function startGame(){
        if(gameStarted) return;
        await prepareNewBoard(true);
      }

      function showTimeOver(){
        finalScoreEl.textContent = score.toLocaleString();
        timeOverModal.classList.add("show");
        timeOverModal.setAttribute("aria-hidden","false");
      }

      function hideTimeOver(){
        timeOverModal.classList.remove("show");
        timeOverModal.setAttribute("aria-hidden","true");
        shareFeedback.textContent = "";
      }


      async function shareScore(){
        const text = `센트비 미니게임에서 ${score.toLocaleString()}점이 나왔어요! 같이 즐겨보세요. 🎮`;
        const shareData = {
          title:"센트비 미니게임 점수",
          text
        };

        try{
          if(navigator.share){
            await navigator.share(shareData);
            shareFeedback.textContent = "점수를 공유했어요!";
            return;
          }

          if(navigator.clipboard && window.isSecureContext){
            await navigator.clipboard.writeText(text);
            shareFeedback.textContent = "공유 문구를 복사했어요!";
            return;
          }

          window.prompt("아래 문구를 복사해서 친구에게 보내보세요.", text);
          shareFeedback.textContent = "공유 문구를 준비했어요!";
        }catch(err){
          if(err && err.name === "AbortError") return;
          try{
            window.prompt("아래 문구를 복사해서 친구에게 보내보세요.", text);
            shareFeedback.textContent = "공유 문구를 준비했어요!";
          }catch(_){
            shareFeedback.textContent = "이 브라우저에서는 공유 기능을 사용할 수 없어요.";
          }
        }
      }

      function showBonus(n){
        if(n <= 0) return;

        bonusEl.textContent = `+${n}초`;
        bonusEl.classList.remove("bonus-pop");
        void bonusEl.offsetWidth;
        bonusEl.classList.add("bonus-pop");
      }

      function showLineFx(p,dir){
        const el = tileAt(p);
        if(!el) return;

        const boardRect = boardEl.getBoundingClientRect();
        const rect = el.getBoundingClientRect();

        const cx = rect.left - boardRect.left + rect.width/2;
        const cy = rect.top - boardRect.top + rect.height/2;

        const beam = document.createElement("div");
        beam.className = `line-fx ${dir === "row" ? "h" : "v"}`;

        if(dir === "row"){
          beam.style.top = `${cy}px`;
        }else{
          beam.style.left = `${cx}px`;
        }

        boardEl.appendChild(beam);
        setTimeout(() => beam.remove(),450);
      }

      async function activateSpecial(p){
        if(locked || ended) return;

        const piece = board[p.r][p.c];
        if(!piece || piece.type !== "special") return;

        locked = true;

        const cells = new Set();

        if(piece.dir === "row"){
          for(let c=0; c<SIZE; c++){
            cells.add(key(p.r,c));
          }
        }else{
          for(let r=0; r<SIZE; r++){
            cells.add(key(r,p.c));
          }
        }

        showLineFx(p,piece.dir);
        animateCells(cells,"burst");

        const gained = cells.size * 120;
        score += gained;

        scoreEl.textContent = score.toLocaleString();

        messageEl.textContent =
          `🎁 ${piece.dir === "row" ? "가로" : "세로"} 한 줄 삭제! +${gained.toLocaleString()}점`;

        await sleep(360);

        for(const id of cells){
          const [r,c] = id.split(",").map(Number);
          board[r][c] = null;
        }

        collapse();
        refill();
        render();

        await sleep(120);

        locked = false;

        if(findMatches().cells.size){
          await resolveMatches();
        }else{
          render();
          await ensurePlayableBoard();
        }
      }

      async function resolveMatches(){
        locked = true;

        while(!ended){
          const result = findMatches();
          const matches = result.cells;
          const specialGroups = result.specials;

          if(!matches.size) break;


          const bonus = Math.floor(matches.size / 3);
          const gained = matches.size * 100;

          score += gained;
          timeLeft += bonus;

          scoreEl.textContent = score.toLocaleString();
          timerEl.textContent = timeLeft;

          showBonus(bonus);

          messageEl.textContent =
            `${matches.size}개 매치! +${gained.toLocaleString()}점` +
            `${specialGroups.length ? " · 🎁 선물 상자 생성!" : ""}` +
            ` · +${bonus}초`;

          animateCells(matches,"breaking");

          await sleep(440);

          const specialPlacements = new Map();
          const newCandyObjects = [];

          for(const group of specialGroups){
            const target =
              group.preferred ||
              group.cells[Math.floor(group.cells.length / 2)] ||
              group.cells[0];

            const id = key(target.r,target.c);

            // If multiple special patterns overlap, keep one candy at that cell.
            if(!specialPlacements.has(id)){
              const candy = special(group.dir);
              specialPlacements.set(id, candy);
              newCandyObjects.push(candy);
            }
          }

          for(const id of matches){
            const [r,c] = id.split(",").map(Number);
            board[r][c] = specialPlacements.get(id) || null;
          }

          // The candy can fall after matched cells disappear.
          // Collapse first, then locate the exact SAME candy object on the final board.
          collapse();
          refill();

          const finalCandyPositions = [];
          for(let r=0; r<SIZE; r++){
            for(let c=0; c<SIZE; c++){
              if(newCandyObjects.includes(board[r][c])){
                finalCandyPositions.push({r,c});
              }
            }
          }

          render();
          await animateCandyBirth(finalCandyPositions);

          await sleep(120);
        }

        locked = false;
        render();
        await ensurePlayableBoard();
      }

      function collapse(){
        for(let c=0; c<SIZE; c++){
          const values = [];

          for(let r=SIZE-1; r>=0; r--){
            if(board[r][c]){
              values.push(board[r][c]);
            }
          }

          for(let r=SIZE-1,i=0; r>=0; r--,i++){
            board[r][c] = values[i] || null;
          }
        }
      }

      function refill(){
        for(let r=0; r<SIZE; r++){
          for(let c=0; c<SIZE; c++){
            if(!board[r][c]){
              board[r][c] = randomPiece(true);
            }
          }
        }
      }

      function startTimer(){
        clearInterval(timerId);

        timerId = setInterval(() => {
          if(ended) return;

          timeLeft = Math.max(0,timeLeft-1);
          timerEl.textContent = timeLeft;

          if(timeLeft <= 0){
            ended = true;
            clearInterval(timerId);
            selected = null;
            locked = false;

            messageEl.textContent =
              `게임 종료! 최종 점수 ${score.toLocaleString()}점 🎉`;

            render();

            setTimeout(() => {
              showTimeOver();
            }, 180);
          }
        },1000);
      }

      async function restart(){
        await prepareNewBoard(true);
      }

      async function restartWithCountdown(){
        await prepareNewBoard(false);
        await runCountdown();
        gameStarted = true;
        render();
        startTimer();
      }

      boardEl.addEventListener("dragstart", e => e.preventDefault());

      restartBtn.addEventListener("click",restart);
      modalRestartBtn.addEventListener("click",restart);
      closeTimeOverBtn.addEventListener("click",() => {
        hideTimeOver();
        showEndedBoardScreen();
      });
      playAgainBtn.addEventListener("click",restartWithCountdown);
      shareScoreBtn.addEventListener("click",shareScore);
      startGameBtn.addEventListener("click",startGame);

      // Initial board is prepared, but the timer starts only after "게임 시작".
      makeBoard();
      if(!hasPossibleMove()){
        shuffleBoardUntilPlayable();
      }
      gameStarted = false;
      hideEndedBoardScreen();
      render();
      showStartScreen();
    })();
  </script>
</body>
</html>
